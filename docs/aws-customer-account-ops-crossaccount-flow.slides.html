<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객 계정 접근 흐름</title>
<!--
  docs/aws-customer-account-ops-crossaccount-flow.md 의 시퀀스를 단계별로 보여 준다.
  사실은 그 문서와 브로커 코드(example-org/credential-broker infra/lambda/crossaccount-credential-broker)가 원본이다.
  외부 의존 없음. 열면 저절로 돌고 끝나면 처음부터 다시 돈다. ← → 로 단계 이동, 스페이스로 재생/정지.
  ?type=User 로 User 방식부터 연다.
-->
<style>
:root{
  --bg:#fbfbfa; --panel:#ffffff; --ink:#18181b; --muted:#71717a; --faint:#d4d4d8; --line:#e4e4e7;
  --accent:#2563eb; --accent-soft:#dbeafe; --sign:#a16207; --sign-soft:#fef3c7;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f0f11;--panel:#18181b;--ink:#f4f4f5;--muted:#a1a1aa;--faint:#3f3f46;--line:#27272a;
        --accent:#60a5fa;--accent-soft:#1e3a5f;--sign:#fbbf24;--sign-soft:#422006;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:32px 16px 48px;min-width:0}
body{overflow-x:hidden}
header h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0 0 6px}
header p{margin:0;color:var(--muted);font-size:14px;line-height:1.6;max-width:72ch}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:24px 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button,.btn{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.btn:disabled{color:var(--faint);cursor:default}
.count{margin-left:auto;font:12px var(--mono);color:var(--muted)}

.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;overflow-x:auto}
svg{display:block;width:100%;min-width:720px;height:auto}
.lane-box{fill:var(--panel);stroke:var(--line)}
.lane-name{font:600 13px var(--sans);fill:var(--ink)}
.lane-sub{font:11px var(--mono);fill:var(--muted)}
.lifeline{stroke:var(--line);stroke-dasharray:3 4}
.msg path{fill:none;stroke:var(--faint);stroke-width:1.5;transition:stroke .3s,opacity .3s}
.msg text{font:12px var(--mono);fill:var(--muted);transition:fill .3s,opacity .3s}
.msg .tag{font:10.5px var(--sans);fill:var(--sign)}
.msg .tag-bg{fill:var(--sign-soft)}
.msg .num{font:600 10.5px var(--mono);fill:var(--muted)}
.msg.future{opacity:.0}
.msg.past path{stroke:var(--muted)}
.msg.now path{stroke:var(--accent);stroke-width:2}
.msg.now text{fill:var(--ink)}
.msg.now .num{fill:var(--accent)}
.msg.now .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dot{fill:var(--accent)}
.arrowhead{fill:var(--faint)} .past .arrowhead{fill:var(--muted)} .now .arrowhead{fill:var(--accent)}

.note{display:grid;grid-template-columns:auto minmax(0,1fr);overflow-wrap:anywhere;gap:4px 16px;margin-top:16px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.note .n{font:600 12px var(--mono);color:var(--accent);padding-top:3px}
.note h2{font-size:16px;font-weight:650;margin:0}
.note p{grid-column:2;margin:4px 0 0;font-size:14px;line-height:1.7;color:var(--ink)}
.note code,.legend code{font:12.5px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.note .ref{grid-column:2;font:12px var(--mono);color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:16px;overflow-wrap:anywhere;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{display:inline-block;width:18px;height:2px;background:var(--accent)}
.sw.sign{height:12px;width:12px;border-radius:3px;background:var(--sign-soft);border:1px solid var(--sign)}
@media (prefers-reduced-motion:reduce){.msg.now .draw{animation:none;stroke-dashoffset:0}.dot{display:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>고객 계정 접근 흐름</h1>
    <p>엔지니어 PC 에는 AWS 키가 없다. 브로커(인터널)가 Payer 계정의 crossaccount IAM User 키로 서명해 고객 role 을 읽기 전용으로 assume 하고,
       그 세션만 돌려준다. 고객 role 정보(이름·ExternalId·방식)는 빌링이 정하고 클라이언트는 바꿀 수 없다.</p>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="고객 role 접근 방식">
      <button type="button" data-type="Role" aria-pressed="true">Role 방식 (Payer role 경유)</button>
      <button type="button" data-type="User" aria-pressed="false">User 방식 (직접)</button>
    </div>
    <button class="btn" id="prev" type="button" aria-label="이전 단계">←</button>
    <button class="btn" id="play" type="button">재생</button>
    <button class="btn" id="next" type="button" aria-label="다음 단계">→</button>
    <span class="count" id="count"></span>
  </div>

  <div class="board"><svg id="seq" role="img" aria-label="고객 계정 접근 시퀀스 다이어그램"></svg></div>

  <section class="note" aria-live="polite">
    <span class="n" id="n"></span><h2 id="t"></h2>
    <p id="b"></p>
    <div class="ref" id="r"></div>
  </section>

  <div class="legend">
    <span><i class="sw"></i>지금 단계</span>
    <span><i class="sw sign"></i>Payer crossaccount User 키로 서명한 호출</span>
    <span>근거: <code>docs/aws-customer-account-ops-crossaccount-flow.md</code></span>
  </div>
</main>

<script>
(() => {
  const LANES = [
    { id: 'pc', name: '엔지니어 PC', sub: 'AWS 키 없음' },
    { id: 'b', name: 'MSP 회사 인터널', sub: '444455556666 · 브로커' },
    { id: 'f', name: '빌링 플랫폼', sub: '777788889999 · role 조회' },
    { id: 's', name: 'MSP 회사', sub: '111122223333 · User·role' },
    { id: 'c', name: '고객 계정', sub: 'cross-account role' },
  ];
  const steps = type => [
    { from: 'pc', to: 'b', label: 'POST /v1/customer-credentials',
      title: '요청 — Slack 토큰과 계정 번호만 보낸다',
      body: '보내는 것은 Slack 로그인 토큰, 고객 계정 번호, 에이전트 이름, 클라이언트 버전뿐이다. role 이름이나 ExternalId 를 보내도 서버는 무시한다.',
      ref: 'skills/aws-customer-account-ops/get-customer-credentials.sh' },
    { self: 'b', label: '버전 · Slack 신원 확인',
      title: '누가 보냈는지 서버가 정한다',
      body: '클라이언트 버전이 최소 버전보다 낮으면 여기서 끝난다(426, 예전 1.x 는 안내). Slack 에 토큰을 물어 팀과 @msp.example.com 메일을 확인하고, 세션 이름 <code>msp-ai@{Slack ID}</code> 를 서버가 붙인다.',
      ref: 'index.mjs §2b·§3' },
    { self: 'b', label: '빌링 플랫폼 API — 활성 고객인가',
      title: '우리 고객 계정인지 먼저 본다',
      body: '빌링 플랫폼에서 활성 고객이 아니면 403 으로 끝나고, 뒤의 빌링·STS 호출은 한 번도 일어나지 않는다.',
      ref: 'lib/billing.mjs assertActiveCustomer' },
    { self: 'b', label: 'SSM — Payer User 키 읽기',
      title: '서명할 키를 꺼낸다',
      body: '인터널 SSM 에 보관된 crossaccount IAM User 키. 이 User 는 <b>Payer 계정</b>에 있다. 브로커 Lambda 역할에는 STS·Lambda·KMS 권한이 없고, 이후 호출은 전부 이 키로 서명한다.',
      ref: 'index.mjs getCrossAccountKeys · template.yaml /access-key/crossaccount' },
    { from: 'b', to: 'f', label: 'invoke crossaccount-sts-api', sign: true,
      title: '고객 role 정보는 빌링이 정한다',
      body: 'role 이름, ExternalId, 접근 방식(User/Role)을 암호화해 돌려준다. 브로커는 KMS 로 데이터 키를 풀어 복호화한다. 계정별로 1시간 캐시한다.',
      ref: 'lib/account-lookup.mjs' },
    { from: 'f', to: 'b', label: 'role·externalId·type 암호문', ret: true, sign: true,
      title: '암호문을 받아 KMS 로 푼다',
      body: 'KMS Decrypt 도 Payer User 키로 서명한다. 키가 어느 계정 것인지는 코드에 없다(문서의 unknown).',
      ref: 'lib/account-lookup.mjs resolveAccountInfo' },
    ...(type === 'Role' ? [
      { from: 'b', to: 's', label: 'AssumeRole role/crossaccount', sign: true,
        title: 'Role 방식 — Payer 의 중간 role 을 한 번 거친다',
        body: 'ExternalId <code>example-external-id</code> 를 붙여 Payer 의 <code>role/crossaccount</code> 를 assume 한다. 이 중간 세션은 다음 호출에만 쓰고, 돌려주지도 로그에 남기지도 않는다.',
        ref: 'lib/customer-assume.mjs INTERMEDIATE_ROLE_ARN' },
      { from: 's', to: 'c', label: 'AssumeRole + ReadOnlyAccess', signBy: '중간 세션 서명',
        title: '중간 세션으로 고객 role 을 읽기 전용으로 assume',
        body: '세션 정책 <code>ReadOnlyAccess</code> 를 서버가 붙인다. 고객 role 에 관리자 권한이 있어도 세션은 읽기 전용이다. 빌링의 ExternalId 와 SourceIdentity(Slack ID)를 함께 보낸다 — 고객 쪽이 SourceIdentity 를 허용하지 않으면 빼고 한 번 더 시도한다.',
        ref: 'lib/customer-assume.mjs assumeCustomerReadOnly' },
    ] : [
      { from: 'b', to: 'c', label: 'AssumeRole + ReadOnlyAccess', sign: true,
        title: 'User 방식 — Payer User 가 고객 role 을 바로 assume',
        body: '중간 홉 없이 Payer crossaccount User 키로 고객 role 을 assume 한다. 세션 정책 <code>ReadOnlyAccess</code>, 빌링의 ExternalId, SourceIdentity 는 Role 방식과 같다.',
        ref: 'lib/customer-assume.mjs assumeCustomerReadOnly' },
    ]),
    { from: 'c', to: 'b', label: '고객 세션 · 최대 1시간', ret: true,
      title: '고객 세션을 받는다',
      body: '수명은 3600초로 묶는다(role chaining 상한과 같다).',
      ref: 'lib/customer-assume.mjs MAX_DURATION_SECONDS' },
    { from: 'b', to: 'pc', label: 'AccessKeyId · Secret · Token · Expiration', ret: true,
      title: '고객 세션만 돌려준다',
      body: '응답은 고객 세션 필드뿐이다. 감사 로그(<code>event: audit</code>)에 Slack ID, 에이전트, 클라이언트 버전, 계정, 발급한 키 ID 가 남는다.',
      ref: 'index.mjs §7' },
    { from: 'pc', to: 'c', label: 'aws … --profile csg-<이름>',
      title: '엔지니어는 읽기만 한다',
      body: '고객 CloudTrail 에는 <code>msp-ai@{Slack ID}</code> 로 보인다. 세션이 끝나면 같은 요청으로 다시 받는다.',
      ref: 'skills/aws-customer-account-ops/SKILL.md' },
  ];

  const NS = 'http://www.w3.org/2000/svg';
  const W = 1000, TOP = 78, ROW = 46, X0 = 100, GAP = 200;
  const x = id => X0 + LANES.findIndex(l => l.id === id) * GAP;
  const svg = document.getElementById('seq');
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };

  const query = new URLSearchParams(location.search);
  let type = query.get('type') === 'User' ? 'User' : 'Role', list = steps(type), cur = 0, timer = null;
  const STEP_MS = 1800, END_PAUSE_MS = 5000;

  function draw() {
    svg.textContent = '';
    const H = TOP + list.length * ROW + 24;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    for (const l of LANES) {
      el('line', { class: 'lifeline', x1: x(l.id), x2: x(l.id), y1: 62, y2: H - 8 }, svg);
      el('rect', { class: 'lane-box', x: x(l.id) - 88, y: 8, width: 176, height: 50, rx: 8 }, svg);
      el('text', { class: 'lane-name', x: x(l.id), y: 29, 'text-anchor': 'middle' }, svg).textContent = l.name;
      el('text', { class: 'lane-sub', x: x(l.id), y: 46, 'text-anchor': 'middle' }, svg).textContent = l.sub;
    }
    list.forEach((s, i) => {
      const y = TOP + i * ROW + 22;
      const g = el('g', { class: 'msg', 'data-i': i }, svg);
      let d, lx, anchor = 'middle', len;
      if (s.self) {
        const sx = x(s.self);
        d = `M${sx},${y - 8} h34 v16 h-30`;
        lx = sx + 44; anchor = 'start'; len = 90;
        el('path', { class: 'draw', d, style: `--len:${len}` }, g);
        el('path', { class: 'arrowhead', d: `M${sx + 4},${y + 8} l7,-4 v8 z`, style: 'stroke:none' }, g);
        el('text', { x: lx, y: y + 4, 'text-anchor': anchor }, g).textContent = s.label;
      } else {
        const a = x(s.from), b = x(s.to), dir = Math.sign(b - a);
        len = Math.abs(b - a);
        d = `M${a},${y} H${b - dir * 6}`;
        el('path', { class: 'draw', d, style: `--len:${len}` + (s.ret ? ';stroke-dasharray:5 4' : '') }, g);
        el('path', { class: 'arrowhead', d: `M${b},${y} l${-dir * 8},-4.5 v9 z` }, g);
        el('text', { x: (a + b) / 2, y: y - 7, 'text-anchor': 'middle' }, g).textContent = s.label;
        if (s.sign || s.signBy) {
          const tx = Math.min(a, b) + 10;
          el('rect', { class: 'tag-bg', x: tx - 4, y: y + 4, width: 92, height: 15, rx: 3 }, g);
          el('text', { class: 'tag', x: tx, y: y + 15 }, g).textContent = s.signBy || 'Payer User 서명';
        }
      }
      el('text', { class: 'num', x: 14, y: y + 4 }, g).textContent = String(i + 1).padStart(2, '0');
    });
    show();
  }

  function show() {
    const s = list[cur];
    svg.querySelectorAll('.msg').forEach(g => {
      const i = +g.dataset.i;
      g.setAttribute('class', 'msg ' + (i < cur ? 'past' : i === cur ? 'now' : 'future'));
    });
    svg.querySelector('.dot')?.remove();
    const now = svg.querySelector(`.msg[data-i="${cur}"] .draw`);
    if (now && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const dot = el('circle', { class: 'dot', r: 4 }, svg);
      const m = el('animateMotion', { dur: '.7s', fill: 'freeze', path: now.getAttribute('d') }, dot);
      m.beginElement?.();
    }
    document.getElementById('n').textContent = String(cur + 1).padStart(2, '0');
    document.getElementById('t').textContent = s.title;
    document.getElementById('b').innerHTML = s.body;
    document.getElementById('r').textContent = s.ref;
    document.getElementById('count').textContent = `${cur + 1} / ${list.length}`;
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === list.length - 1;
  }

  const go = i => { cur = Math.max(0, Math.min(list.length - 1, i)); show(); };
  const tick = () => {
    if (cur < list.length - 1) { go(cur + 1); timer = setTimeout(tick, cur === list.length - 1 ? END_PAUSE_MS : STEP_MS); }
    else { go(0); timer = setTimeout(tick, STEP_MS); }
  };
  const stop = () => { clearTimeout(timer); timer = null; document.getElementById('play').textContent = '재생'; };
  const play = () => {
    if (timer) return stop();
    document.getElementById('play').textContent = '정지';
    timer = setTimeout(tick, STEP_MS);
  };

  document.getElementById('prev').onclick = () => { stop(); go(cur - 1); };
  document.getElementById('next').onclick = () => { stop(); go(cur + 1); };
  document.getElementById('play').onclick = play;
  document.querySelectorAll('.seg button').forEach(btn => btn.onclick = () => {
    stop();
    type = btn.dataset.type;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b === btn));
    list = steps(type); cur = Math.min(cur, list.length - 1); draw();
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
    else if (e.key === ' ') { e.preventDefault(); play(); }
  });
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === type));
  draw();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) play();
})();
</script>
</body>
</html>
